<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backstage CV — CRM de Shows</title>
    <script>
      // Aplica o tema ANTES do React montar, senão a tela pisca em branco
      // durante o carregamento. A chave é a mesma de src/context/ThemeContext.tsx
      // e conserva o nome antigo do sistema de propósito: trocá-la descartaria
      // a preferência de tema já salva no navegador de quem usa.
      (function () {
        try {
          var stored = localStorage.getItem("sistema-tato-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* localStorage bloqueado: segue no tema claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
